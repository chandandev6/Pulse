# Deploys to the Azure VM after CI passes on main
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button on GitHub for deploying by hand

# Never run two deploys at once: a new one waits for the running one to finish
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only after a green CI run caused by a push, never a failed run or a pull request
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.VM_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Pull, rebuild, restart
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} bash -s <<'EOF'
          set -e
          cd ~/Pulse
          git pull --ff-only
          docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
          docker image prune -f
          EOF

      - name: Check the site is up
        run: |
          sleep 10
          curl --fail --retry 5 --retry-delay 5 https://pulse-log.app/health