<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse: self-hosted error tracking with on-call paging</title>
    <meta
      name="description"
      content="Pulse catches crashes in your JavaScript and Node.js apps, groups duplicates into issues, and pages whoever is on call, escalating until someone acknowledges. Self-host it with Docker Compose."
    />
    <link rel="canonical" href="https://pulse-log.app/" />
    <meta name="theme-color" content="#dce1e5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#05222d" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Link previews (WhatsApp, Slack, LinkedIn, X...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pulse" />
    <meta property="og:url" content="https://pulse-log.app/" />
    <meta property="og:title" content="Pulse: errors in, the right person paged" />
    <meta
      property="og:description"
      content="Self-hosted error tracking with incidents, on-call schedules and escalation."
    />
    <meta property="og:image" content="https://pulse-log.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pulse: errors in, the right person paged" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Tells search engines what Pulse is -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Pulse",
        "url": "https://pulse-log.app/",
        "description": "Self-hosted error tracking with incidents, on-call schedules and escalation policies.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Linux, Docker",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "codeRepository": "https://github.com/chandandev6/Pulse"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
