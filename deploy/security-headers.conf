# Browser protections, included by nginx.conf in the server and in every location that sets
# its own add_header (nginx forgets the server's add_header lines inside such a location).
#
# HSTS: browsers use https only for 6 months. Only sent on https requests (see $hsts in nginx.conf),
#   so self-hosting over plain http on a LAN keeps working.
# CSP: scripts only from this site, so injected HTML can't run code. Styles allow inline because
#   React and the prerendered landing page use style attributes. connect-src allows https so the
#   dashboard can report its own errors to another Pulse instance (PULSE_WEB_DSN).
# frame-ancestors / X-Frame-Options: nobody can load Pulse in an invisible frame (clickjacking).
# Referrer-Policy: full URLs (one-click links) never leak to other sites.
add_header Strict-Transport-Security $hsts always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
