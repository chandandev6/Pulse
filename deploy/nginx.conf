# The only public entry point. One origin for everything, like Vite's proxy in development:
#   /           the dashboard (static files from the image)
#   /backend/*  dashboard → API calls (the /backend prefix is removed)
#   /api/*      SDKs sending events (ingestion)
#   /health     the API's health check

# HSTS only when the visitor came over https (Cloudflare, Caddy… set X-Forwarded-Proto),
# so self-hosting over plain http keeps working. An empty value means nginx sends no header.
map $http_x_forwarded_proto $hsts {
  https "max-age=15552000";
  default "";
}

map $http_x_forwarded_proto $forwarded_proto {
  "" $scheme;
  default $http_x_forwarded_proto;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Look the API up through Docker's DNS on every request (cached 10s), not once at start:
  # a recreated api container gets a new IP, and a fixed one would mean 502s until restart.
  # (proxy_pass with a variable is what makes nginx use the resolver.)
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:3000;

  # Matches the API's event size limit (200 KB) with room for headers
  client_max_body_size 1m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Who is the real client? A proxy on this machine or a private network (cloudflared,
  # Caddy, Docker's gateway) tells us in X-Forwarded-For. real_ip_recursive takes the
  # right-most address that isn't one of those proxies, so a value the client typed into
  # the header itself (always further left) is ignored. Requests from the internet that
  # reach nginx directly keep their own address.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from ::1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Then hand the API exactly one address (it trusts one hop: TRUST_PROXY=1).
  # Replacing the header, not appending to it, is what stops clients faking their IP.
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_http_version 1.1;

  include /etc/nginx/snippets/security-headers.conf;

  # Don't advertise the nginx version
  server_tokens off;

  location /backend/ {
    rewrite ^/backend/(.*)$ /$1 break; # the API doesn't know about /backend
    proxy_pass $api;
  }

  location /api/ {
    proxy_pass $api;
  }

  # Source map uploads from CI are bigger than events (the API allows 20 MB)
  location ~ ^/api/[^/]+/sourcemaps$ {
    client_max_body_size 21m;
    proxy_pass $api;
  }

  location = /health {
    proxy_pass $api;
  }

  # Built files have a hash in their name, so they can be cached forever
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The service worker must always be fresh, or browsers keep an old one
  location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  # The front page, already rendered at build time so search engines see its text
  location = / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files /landing.html =404;
  }

  # Single-page app: unknown paths (e.g. /projects/123) load index.html, React routes them
  location / {
    try_files $uri /index.html;
  }
}
