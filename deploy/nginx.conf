# The only public entry point. One origin for everything, like Vite's proxy in development:
#   /           the dashboard (static files from the image)
#   /backend/*  dashboard → API calls (the /backend prefix is removed)
#   /api/*      SDKs sending events (ingestion)
#   /health     the API's health check

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Look the API up through Docker's DNS on every request (cached 10s), not once at start:
  # a recreated api container gets a new IP, and a fixed one would mean 502s until restart.
  # (proxy_pass with a variable is what makes nginx use the resolver.)
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:3000;

  # Matches the API's event size limit (200 KB) with room for headers
  client_max_body_size 1m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Tell the API who the real client is (it trusts this because TRUST_PROXY=true)
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version 1.1;

  location /backend/ {
    rewrite ^/backend/(.*)$ /$1 break; # the API doesn't know about /backend
    proxy_pass $api;
  }

  location /api/ {
    proxy_pass $api;
  }

  # Source map uploads from CI are bigger than events (the API allows 20 MB)
  location ~ ^/api/[^/]+/sourcemaps$ {
    client_max_body_size 21m;
    proxy_pass $api;
  }

  location = /health {
    proxy_pass $api;
  }

  # Built files have a hash in their name, so they can be cached forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The service worker must always be fresh, or browsers keep an old one
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # The front page, already rendered at build time so search engines see its text
  location = / {
    add_header Cache-Control "no-cache";
    try_files /landing.html =404;
  }

  # Single-page app: unknown paths (e.g. /projects/123) load index.html, React routes them
  location / {
    try_files $uri /index.html;
  }
}
