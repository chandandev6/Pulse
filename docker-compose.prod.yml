# Pulse in production: one command starts everything.
#   cp .env.prod.example .env.prod   (set APP_SECRET and POSTGRES_PASSWORD)
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
# Then open http://localhost:8080 (or your PUBLIC_URL).

# Settings every Pulse process (api, worker, migrate) shares
x-pulse-env: &pulse-env
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-pulse}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}@postgres:5432/${POSTGRES_DB:-pulse}}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env.prod (openssl rand -base64 48)}
  API_HOST: 0.0.0.0
  API_PORT: 3000
  TRUST_PROXY: "1" # exactly one proxy (nginx) in front; it sets the real client IP
  # SDKs and people both go through nginx, so both URLs are the public one
  API_PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
  WEB_PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_FROM: ${SMTP_FROM:-Pulse <alerts@pulse.local>}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_FROM: ${TWILIO_FROM:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:alerts@pulse.local}
  ALLOW_PRIVATE_WEBHOOKS: ${ALLOW_PRIVATE_WEBHOOKS:-false}
  REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
  MAX_EVENTS_PER_MINUTE: ${MAX_EVENTS_PER_MINUTE:-}
  MAX_MONTHLY_QUOTA: ${MAX_MONTHLY_QUOTA:-}
  MAX_SOURCE_MAP_MB: ${MAX_SOURCE_MAP_MB:-200}
  PULSE_DSN: ${PULSE_DSN:-}
  PULSE_RELEASE: ${PULSE_RELEASE:-}

# Both images share the build stage, so both get the same args (else it's built twice)
x-build-args: &build-args
  PULSE_WEB_DSN: ${PULSE_WEB_DSN:-}
  PULSE_RELEASE: ${PULSE_RELEASE:-}

x-pulse-api: &pulse-api
  build: { context: ., target: api, args: *build-args }
  image: pulse-api
  restart: unless-stopped
  environment: *pulse-env

name: pulse-prod

services:
  # The bundled databases and mail catcher only start when their profile is on
  # (COMPOSE_PROFILES in .env.prod). Using Neon/Upstash/real SMTP? Leave them out.
  postgres:
    image: postgres:17-alpine
    profiles: [local-db]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulse}
      # Empty = the postgres image refuses to start, so a missing password still fails loudly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-pulse}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No "ports": only the other containers can reach the database

  redis:
    image: redis:7-alpine
    profiles: [local-redis]
    restart: unless-stopped
    # appendonly: queued jobs (events, escalations) survive a Redis restart
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs once at every start: applies new migrations, then exits
  migrate:
    <<: *pulse-api
    restart: "no"
    command: ["node", "dist/migrate.js"]
    depends_on:
      postgres: { condition: service_healthy, required: false }

  api:
    <<: *pulse-api
    command: ["node", "dist/server.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy, required: false }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    <<: *pulse-api
    command: ["node", "dist/worker.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy, required: false }
    # Give running jobs time to finish on "docker compose down"
    stop_grace_period: 30s

  web:
    build: { context: ., target: web, args: *build-args }
    image: pulse-web
    restart: unless-stopped
    # Only this machine can reach it by default (a tunnel or TLS proxy on the host forwards
    # to it). To serve straight to the internet, set WEB_PORT=80 in .env.prod.
    ports:
      - "${WEB_PORT:-127.0.0.1:8080}:80"
    depends_on:
      api: { condition: service_healthy }

  # Catches outgoing email until you configure a real SMTP server (inbox on :8025)
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: [mailpit]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  pgdata:
  redisdata:
